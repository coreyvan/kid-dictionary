syntax = "proto3";

package kiddictionary.v1;

import "google/api/annotations.proto";
import "kiddictionary/v1/common.proto";

// ConversationService handles conversation management.
service ConversationService {
  // CreateConversation starts a new conversation.
  rpc CreateConversation(CreateConversationRequest) returns (CreateConversationResponse) {
    option (google.api.http) = {
      post: "/kiddictionary.v1.ConversationService/CreateConversation"
      body: "*"
    };
  }

  // GetConversation retrieves a conversation by ID.
  rpc GetConversation(GetConversationRequest) returns (GetConversationResponse) {
    option (google.api.http) = {
      post: "/kiddictionary.v1.ConversationService/GetConversation"
      body: "*"
    };
  }

  // ListConversations returns the user's conversations.
  rpc ListConversations(ListConversationsRequest) returns (ListConversationsResponse) {
    option (google.api.http) = {
      post: "/kiddictionary.v1.ConversationService/ListConversations"
      body: "*"
    };
  }

  // DeleteConversation removes a conversation and its messages.
  rpc DeleteConversation(DeleteConversationRequest) returns (DeleteConversationResponse) {
    option (google.api.http) = {
      post: "/kiddictionary.v1.ConversationService/DeleteConversation"
      body: "*"
    };
  }
}

message CreateConversationRequest {
  string title = 1;
  AgeBracket age_bracket = 2;
}

message CreateConversationResponse {
  Conversation conversation = 1;
}

message GetConversationRequest {
  string id = 1;
}

message GetConversationResponse {
  Conversation conversation = 1;
  repeated Message messages = 2;
}

message ListConversationsRequest {
  int32 page_size = 1;
  string page_token = 2;
}

message ListConversationsResponse {
  repeated Conversation conversations = 1;
  string next_page_token = 2;
}

message DeleteConversationRequest {
  string id = 1;
}

message DeleteConversationResponse {}