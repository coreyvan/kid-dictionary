---

version: '3'

# This taskfile syntax is defined here: https://taskfile.dev/usage/

tasks:
  default:
    cmds:
      - task --list-all

  # ===========================================================================
  # Docker Development Environment
  # ===========================================================================
  up:
    desc: Start the complete development environment (database, migrations, app with hot reload)
    cmds:
      - docker compose up -d
      - echo "Environment started. Run 'task logs' to view logs."

  down:
    desc: Stop all containers (preserves data)
    cmds:
      - docker compose down
      - echo "Environment stopped. Data preserved in volumes."

  reset:
    desc: Stop containers and wipe all data (clean slate)
    cmds:
      - docker compose down -v
      - docker compose up -d
      - echo "Environment reset. Fresh database with migrations applied."

  status:
    desc: Show container status
    cmds:
      - docker compose ps

  logs:
    desc: Follow all container logs
    cmds:
      - docker compose logs -f

  logs:app:
    desc: Follow app container logs only
    cmds:
      - docker compose logs -f app

  db:shell:
    desc: Open PostgreSQL shell
    cmds:
      - docker compose exec db psql -U postgres -d kid_dictionary

  # ===========================================================================
  # Local Development (without Docker)
  # ===========================================================================

  init:
    desc: Initialize the development environment
    cmds:
      - echo "Setting up development environment..."
      - cp .env.example .env
      - echo "Environment file created from example."

  tidy:
    desc: Tidy up Go module dependencies
    cmds:
      - go mod tidy
      - echo "Go module dependencies tidied."

  generate:
    desc: Generate code from protobuf definitions
    cmds:
      - buf dep update
      - buf generate
      - echo "Protobuf code generated."

  generate:mocks:
    desc: Generate mock implementations using moq
    cmds:
      - rm -f ./internal/llm/*_mock.go
      - go generate ./internal/llm/...
      - echo "Mock implementations generated."

  generate:ts:
    desc: Generate TypeScript client from protobuf definitions
    dir: frontend
    cmds:
      - rm -rf src/gen
      - buf generate
      - echo "TypeScript client generated."

  lint:proto:
    desc: Lint protobuf definitions
    cmds:
      - buf lint

  build:
    desc: Build the server binary
    deps: [generate]
    cmds:
      - go build -o bin/server ./cmd/server

  run:
    desc: Run the server
    deps: [generate]
    cmds:
      - go run ./cmd/server

  test:acceptance:
    desc: Run acceptance tests (requires database to be running)
    cmds:
      - go test ./tests/acceptance/... -race
      - echo "Acceptance tests passed."

  layer-check:
    desc: Verify layer boundary compliance (transport->service->repository)
    cmds:
      - |
        echo "Checking layer boundaries..."
        VIOLATIONS=0

        # Check transport layer doesn't import repository
        echo "Checking transport layer..."
        TRANSPORT_IMPORTS=$(go list -f '{{range .Imports}}{{.}}{{"\n"}}{{end}}' ./internal/transport/... 2>/dev/null | grep 'internal/repository' || true)
        if [ -n "$TRANSPORT_IMPORTS" ]; then
          echo "  ERROR: Transport imports repository packages:"
          echo "$TRANSPORT_IMPORTS" | sed 's/^/    /'
          VIOLATIONS=$((VIOLATIONS + 1))
        else
          echo "  OK: Transport does not import repository"
        fi

        # Check service layer doesn't import transport or repository
        echo "Checking service layer..."
        SERVICE_IMPORTS=$(go list -f '{{range .Imports}}{{.}}{{"\n"}}{{end}}' ./internal/service/... 2>/dev/null | grep -E 'internal/(transport|repository)' || true)
        if [ -n "$SERVICE_IMPORTS" ]; then
          echo "  ERROR: Service imports transport/repository packages:"
          echo "$SERVICE_IMPORTS" | sed 's/^/    /'
          VIOLATIONS=$((VIOLATIONS + 1))
        else
          echo "  OK: Service does not import transport or repository"
        fi

        # Summary
        echo ""
        if [ $VIOLATIONS -eq 0 ]; then
          echo "All layer boundaries are compliant."
          exit 0
        else
          echo "Found $VIOLATIONS layer boundary violation(s)."
          exit 1
        fi

  # ===========================================================================
  # Git Hooks (Lefthook)
  # ===========================================================================

  init:hooks:
    desc: Install Lefthook and set up git hooks
    cmds:
      - go install github.com/evilmartians/lefthook/v2@latest
      - lefthook install
      - echo "Git hooks installed successfully."

  # ===========================================================================
  # Linting
  # ===========================================================================

  lint:
    desc: Run golangci-lint on entire codebase
    cmds:
      - golangci-lint run ./...

  lint:staged:
    desc: Run golangci-lint on staged Go files only
    cmds:
      - |
        STAGED_FILES=$(git diff --cached --name-only --diff-filter=ACM | grep '\.go$' || true)
        if [ -z "$STAGED_FILES" ]; then
          echo "No staged Go files to lint."
          exit 0
        fi
        echo "Linting staged files:"
        echo "$STAGED_FILES"
        golangci-lint run $STAGED_FILES

  # ===========================================================================
  # Testing
  # ===========================================================================

  test:unit:
    desc: Run unit tests (excludes acceptance tests)
    cmds:
      - go test $(go list ./... | grep -v /tests/acceptance) -race
      - echo "Unit tests passed."